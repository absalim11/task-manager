                    { id: 'admin-gallery', label: '8. Gallery' },
                    { id: 'admin-gallery-album', label: '8.1 Album', isSub: true },
                    { id: 'admin-gallery-isi', label: '8.2 Isi Gallery', isSub: true },
                    { id: 'admin-banner', label: '9. Banner' },
                    { id: 'admin-iklan', label: '10. Iklan' },
                    { id: 'admin-identitas', label: '11. Identitas Website' },
                    { id: 'admin-user-manajemen', label: '12. User Manajemen' },
                ]
            },
            {
                title: "Lainnya",
                items: [ { id: 'penutup', label: 'Penutup' } ]
            }
        ];

        // State Global
        let activeSection = 'pendahuluan';

        // Render Navigasi
        function renderNavigation(categories = navCategories) {
            const container = document.getElementById('nav-container');
            if (!categories.length) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 dark:text-gray-400">No results found.</div>`;
                return;
            }
            let html = '';
            categories.forEach(category => {
                html += `<div class="mb-6">
                            <h3 class="px-3 text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2">${category.title}</h3>
                            <ul class="space-y-1">`;

                category.items.forEach(item => {
                    const isActive = activeSection === item.id;
                    const paddingClass = item.isSub ? 'pl-8 pr-3 text-[13px]' : 'px-3 text-sm';
                    const activeClass = isActive
                        ? 'bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 font-semibold'
                        : (item.isSub ? 'text-gray-500 dark:text-gray-400 font-normal hover:bg-gray-100 dark:hover:bg-gray-700' : 'text-gray-700 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white');

                    const chevron = (isActive && !item.isSub) ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500 dark:text-blue-400 flex-shrink-0"><path d="m9 18 6-6-6-6"/></svg>` : '';

                    html += `<li>
                                <button onclick="navigate('${item.id}')" class="nav-item w-full flex items-center justify-between py-2 rounded-md text-left ${paddingClass} ${activeClass}">
                                    ${item.label}
                                    ${chevron}
                                </button>
                             </li>`;
                });
                html += `</ul></div>`;
            });

            container.innerHTML = html;
        }
        // Render Konten Utama
        function renderContent() {
            const container = document.getElementById('main-content-area');
            const data = docData[activeSection];
            if (!data) return;

            let html = `
                <div class="mb-8">
                    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-4">${data.title}</h1>
            `;

            // Gambar Tunggal
            if (data.image) {
                html += `
                    <div class="my-6 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden shadow-sm">
                        <img src="${data.image}" alt="Screenshot ${data.title}" class="w-full h-auto object-cover" />
                        <div class="bg-gray-50 dark:bg-gray-800 px-4 py-2 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-500 dark:text-gray-400 text-center">
                            Tampilan UI - ${data.title}
                        </div>
                    </div>
                `;
            }

            // Banyak Gambar
            if (data.images) {
                data.images.forEach(img => {
                    html += `
                        <div class="my-6 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden shadow-sm">
                            <img src="${img.url}" alt="${img.caption}" class="w-full h-auto object-cover border-b border-gray-200 dark:border-gray-700" />
                            <div class="bg-gray-50 dark:bg-gray-800 px-4 py-3 text-sm text-gray-600 dark:text-gray-300 font-medium text-center">
                                ${img.caption}
                            </div>
                        </div>
                    `;
                });
            }

            html += `<p class="text-lg text-gray-600 dark:text-gray-300 leading-relaxed">${data.content}</p></div>`;

            // Sub-seksi
            if (data.subsections) {
                html += `<div class="space-y-8 mt-8">`;
                data.subsections.forEach(sub => {
                    html += `
                        <div class="border-t border-gray-100 dark:border-gray-800 pt-6">
                            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-3">${sub.subtitle}</h2>
                            <p class="text-gray-600 dark:text-gray-400 leading-relaxed whitespace-pre-line">${sub.text}</p>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // Fungsi Navigasi
        function navigate(id) {
            activeSection = id;
            renderNavigation();
            renderContent();
            closeSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Manajemen Sidebar Mobile
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const iconMenu = document.getElementById('icon-menu');
        const iconX = document.getElementById('icon-x');
        let isSidebarOpen = false;

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                iconMenu.classList.add('hidden');
                iconMenu.classList.remove('block');
                iconX.classList.remove('hidden');
                iconX.classList.add('block');
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            isSidebarOpen = false;
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
            iconMenu.classList.remove('hidden');
            iconMenu.classList.add('block');
            iconX.classList.add('hidden');
            iconX.classList.remove('block');
        }

        document.getElementById('mobile-menu-btn').addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);

        // Manajemen Dark Mode
        const themeToggleBtn = document.getElementById('theme-toggle');
        const iconMoon = document.getElementById('icon-moon');
        const iconSun = document.getElementById('icon-sun');
        const htmlElement = document.documentElement;

        // Cek preferensi user sebelumnya dari localStorage
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            iconSun.classList.remove('block');
            iconSun.classList.add('hidden');
            iconMoon.classList.remove('hidden');
            iconMoon.classList.add('block');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', function() {
            // Toggle icon
            iconSun.classList.toggle('hidden');
            iconSun.classList.toggle('block');
            iconMoon.classList.toggle('hidden');
            iconMoon.classList.toggle('block');

            // Jika sedang light mode
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                // Jika sedang dark mode
                htmlElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // Search Functionality
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', function() {
            const term = this.value.trim().toLowerCase();
            if (!term) {
                renderNavigation();
            } else {
                const filtered = navCategories.map(cat => {
                    const items = cat.items.filter(item => {
                        const data = docData[item.id];
                        const titleMatch = data.title.toLowerCase().includes(term);
                        const labelMatch = item.label.toLowerCase().includes(term);
                        return titleMatch || labelMatch;
                    });
                    return { ...cat, items };
                }).filter(cat => cat.items.length > 0);
                renderNavigation(filtered);
            }
        });

        // Inisialisasi Pertama Kali
        renderNavigation();
        renderContent();
    </script>
</body>
</html>
